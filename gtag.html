<script>
  // Inject audio player into title slide after page loads
  document.addEventListener('DOMContentLoaded', function() {
    var titleSlide = document.getElementById('title-slide');
    if (titleSlide) {
      var audio = document.createElement('audio');
      audio.controls = true;
      audio.src = 'mgt100_theme_song.mp3';
      audio.style.marginTop = '0.5em';
      titleSlide.appendChild(audio);
    }
  });
