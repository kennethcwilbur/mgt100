<script>
  // Inject audio player into title slide after page loads

      var audio = document.createElement('audio');
      audio.controls = true;
      audio.src = 'https://kennethcwilbur.github.io/mgt100/mgt100_theme_song.mp3';
      audio.style.marginTop = '0.5em';
      titleSlide.appendChild(audio);

      link.download = 'mgt100_theme_song.mp3';
      link.textContent = '[download theme song]';

      link.style.marginTop = '0.2em';
      titleSlide.appendChild(link);
    }
  });
